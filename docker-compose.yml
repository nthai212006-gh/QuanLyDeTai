services:
  # ==============================================================================
  # 1. DATABASE SERVICE (MySQL 8.0)
  # ==============================================================================
  mysql-db:
    image: mysql:8.0
    container_name: quanlydetai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "quanly_detai_db"
      TZ: "Asia/Ho_Chi_Minh"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto import schema and triggers when container is first created
      - ./database/quanly_detai_database_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./create_advanced_db_objects.sql:/docker-entrypoint-initdb.d/02_advanced_objects.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - quanlydetai-network

  # ==============================================================================
  # 2. SPRING BOOT APPLICATION SERVICE
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quanlydetai-app
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/quanly_detai_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8089
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "8089:8089"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - quanlydetai-network

networks:
  quanlydetai-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_uploads:
    driver: local
