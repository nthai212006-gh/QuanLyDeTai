server.port=${PORT:8080}

spring.application.name=QuanLyDeTai
spring.config.import=optional:file:.env[.properties]



server.servlet.encoding.charset=UTF-8

server.servlet.encoding.force=true

server.servlet.encoding.enabled=true



# ===============================

# DATABASE CONFIGURATION (MySQL / HeidiSQL)

# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quanly_detai_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# Hibernate / JPA

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# ===============================

# THYMELEAF CONFIGURATION (MVC VIEW)

# ===============================

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

spring.thymeleaf.mode=HTML

spring.thymeleaf.encoding=UTF-8

spring.thymeleaf.cache=false



# ===============================

# FILE UPLOAD LIMITS

# ===============================

spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=50MB



# ===============================

# MAIL CONFIGURATION (Simulated / Gmail SMTP)

# ===============================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=fit.notification.service@gmail.com

spring.mail.password=your_app_password

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true



# ===============================

# AI ASSISTANT CONFIGURATION (Google Gemini REST API)

# ===============================

gemini.api.key=${GEMINI_API_KEY:}

gemini.api.model=gemini-flash-latest

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/${gemini.api.model}:generateContent

gemini.api.timeout-seconds=8

