<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Hệ Thống Quản Lý Đề Tài</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/images/fit-logo.png}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="text-center my-5">
            <img th:src="@{/images/fit-logo.png}" alt="Logo FIT HCMUTE" height="95" class="mb-3 d-block mx-auto">
            <h1 class="fw-bold text-dark">HỆ THỐNG QUẢN LÝ ĐỀ TÀI SINH VIÊN</h1>
            <p class="text-muted lead">Khoa Công Nghệ Thông Tin - Cổng Thông Tin Đăng Ký & Quản Lý Đề Tài</p>
            <div class="mt-4">
                <a th:href="@{/dashboard}" class="btn btn-primary btn-lg px-4 me-2">
                    <i class="fa-solid fa-gauge me-2"></i>Truy cập Bảng điều khiển
                </a>
                <a th:href="@{/login}" class="btn btn-outline-secondary btn-lg px-4">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng Nhập
                </a>
            </div>
        </div>
    </div>
</body>
</html>
